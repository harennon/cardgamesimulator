services:
  frontend:
    image: nginx-frontend
    build:
      context: .
      dockerfile: ./src/frontend/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      - backend
    environment:
      - BACKEND_PORT=3000
    ports:
      - "80:80"
    networks:
      - app

  backend:
    image: express-backend
    env_file:
      - .env
    build:
      context: .
      dockerfile: ./src/backend/Dockerfile
    ports:
      - "3000:3000"
    networks:
      - app
      - supabase

networks:
  app:
  supabase:
    name: supabase_network_cardgamesimulator
    external: true
