server {
    listen ${PORT};

    # Serve static frontend files
    root /app/build/frontend;
    index index.html;

    # Static assets — let nginx serve directly
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirect /api to /api/ to avoid double-slash proxy issues
    location = /api {
        return 302 /api/;
    }

    # Proxy API requests to Express
    location /api/ {
        # Must match ATTACHMENT_BODY_LIMIT in
        # src/backend/api/feedback/submitFeedback.ts (feedback screenshot uploads).
        client_max_body_size 7m;
        proxy_pass http://localhost:3000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy health check to Express
    location /health {
        proxy_pass http://localhost:3000/health;
        proxy_set_header Host $http_host;
    }

    # Socket.IO WebSocket proxy
    location /socket.io/ {
        proxy_pass http://localhost:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}
