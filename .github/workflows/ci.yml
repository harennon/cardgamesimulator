name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run build
      - run: npm test
      # Drift gate (LLD 77 §5) against a captured/fixture diff — fail-closed,
      # no prod access. The `--linked` wiring against live prod is human-owned.
      - name: Drift gate (fixture diff)
        run: npm run verify:drift -- --diff-file scripts/fixtures/clean-diff.json
      # Destructive-DDL gate (issue #91) — scans supabase/migrations/*.sql and
      # fails the build if any migration DROPs a table/column/index/function,
      # DELETEs, or TRUNCATEs without an explicit per-file + per-operation entry
      # in destructive-ddl.allowlist.json. Fail-closed, no prod access: this is
      # the review-layer enforcement of "migrations may add but never destroy",
      # since Postgres role privileges cannot express "alter but not drop".
      - name: Destructive-DDL gate
        run: npm run verify:no-destructive-ddl

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Export Supabase env vars
        run: |
          echo "SUPABASE_URL=http://localhost:54321" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$(supabase status -o env | grep ANON_KEY | cut -d= -f2- | tr -d '\"')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | grep SERVICE_ROLE_KEY | cut -d= -f2- | tr -d '\"')" >> $GITHUB_ENV
          echo "SUPABASE_JWT_SECRET=$(supabase status -o env | grep JWT_SECRET | cut -d= -f2- | tr -d '\"')" >> $GITHUB_ENV
      - run: npm ci
      - run: npm run build:backend
      # Post-condition verification (LLD 77 §6) against the local `supabase start`
      # DB, which has every migration applied. Fail-closed: a RAISEd
      # post-condition or a coverage gap exits non-zero. The scripted,
      # non-skippable replacement for the manual post-apply SELECT.
      - name: Verify migration post-conditions
        run: npm run verify:postconditions
      - run: npm run test:integration

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Export Supabase env vars
        run: |
          echo "SUPABASE_URL=http://localhost:54321" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$(supabase status -o env | grep ANON_KEY | cut -d= -f2- | tr -d '\"')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | grep SERVICE_ROLE_KEY | cut -d= -f2- | tr -d '\"')" >> $GITHUB_ENV
          echo "SUPABASE_JWT_SECRET=$(supabase status -o env | grep JWT_SECRET | cut -d= -f2- | tr -d '\"')" >> $GITHUB_ENV
          echo "VITE_SUPABASE_URL=http://localhost:54321" >> $GITHUB_ENV
          echo "VITE_SUPABASE_ANON_KEY=$(supabase status -o env | grep ANON_KEY | cut -d= -f2- | tr -d '\"')" >> $GITHUB_ENV
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - name: Run E2E tests
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

