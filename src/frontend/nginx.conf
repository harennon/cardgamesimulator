server {
    listen 80;
    # frontend server
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api {
        return 302 /api/;
    }

    # proxy to backend
    location /api/event {
        proxy_pass http://backend:${BACKEND_PORT}/event;
        proxy_set_header Host $http_host;

        # extra long timeout for SSE
        proxy_read_timeout 5m;
        chunked_transfer_encoding off;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/testEvent {
        proxy_pass http://backend:${BACKEND_PORT}/testEvent;
        proxy_set_header Host $http_host;

        # extra long timeout for SSE
        proxy_read_timeout 5m;
        chunked_transfer_encoding off;
        proxy_set_header Connection '';
    }

    location /api/ {
        proxy_pass http://backend:${BACKEND_PORT}/;
        proxy_set_header Host $http_host;
    }
    
}
